
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/trustvault}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
server.port=${PORT:8081}
# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.servlet.multipart.enabled=true
trustvault.storage-dir=${user.home}/TrustVault-Storage
trustvault.registration.rate-limit.max-attempts=${REGISTRATION_RATE_LIMIT_MAX_ATTEMPTS:10}
trustvault.registration.rate-limit.window-seconds=${REGISTRATION_RATE_LIMIT_WINDOW_SECONDS:900}